<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" font-family="sans-serif"><rect width="1280" height="800" fill="#ffffff"/><rect width="1280" height="44" fill="#e9ecf2"/><text x="20" y="28" font-size="14" fill="#555">https://mock.local/gvisor</text><text x="42" y="80" font-size="24" font-weight="bold" fill="#111">gVisor overview (mock fixture)</text><text x="42" y="110" font-size="15" fill="#1d2330">gVisor overview</text><text x="42" y="132" font-size="15" fill="#1d2330"></text><rect x="36" y="139" width="1002" height="21" fill="#ffdd00" fill-opacity="0.45" stroke="#e0a800" stroke-width="2"/><text x="42" y="154" font-size="15" fill="#1d2330">gVisor is an application kernel, written in Go, that implements a substantial portion of the Linux system call</text><text x="42" y="176" font-size="15" fill="#1d2330">interface.</text><text x="42" y="198" font-size="15" fill="#1d2330">It provides an additional layer of isolation between running applications and the host operating system.</text><text x="42" y="220" font-size="15" fill="#1d2330">gVisor includes an OCI runtime called runsc that integrates with Docker and Kubernetes.</text><text x="42" y="242" font-size="15" fill="#1d2330">Workloads that make many system calls can run slower under gVisor than under the default runc runtime.</text><rect y="772" width="1280" height="28" fill="#14141e" fill-opacity="0.85"/><text x="10" y="791" font-size="12" font-family="monospace" fill="#fff">receipt · 2026-11-27T11:32:30Z · https://mock.local/gvisor · MOCK</text></svg>